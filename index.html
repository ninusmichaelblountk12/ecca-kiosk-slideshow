<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Reload every 5 minutes -->
  <meta http-equiv="refresh" content="300">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 45px);
      border: 0;
    }

    #hide-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45px;
      background: black;
      z-index: 9999;
    }
  </style>
</head>

<body>

<iframe
  id="slideshow"
  src="https://docs.google.com/presentation/d/e/2PACX-1vSkwb3-AHcN7y9UChSA-IViBLkH_gRtvNyYa0BlFpP8aaIhEOxlhT7gbGqLOb-FIJclbnRBDgfLulaA/embed?start=true&loop=true&delayms=10000">
</iframe>

<div id="hide-controls"></div>

</body>
</html>
